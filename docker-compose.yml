# Runs the Flask app and PostgreSQL together.
#   docker compose up -d --build
#   docker compose exec web python initialise_db.py
#   docker compose exec web python populate_db.py
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  web:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: astropitch
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  pgdata:
